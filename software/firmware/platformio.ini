; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = development-r8

[common]
build_flags =
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
board_build.partitions = partition.csv
; Lockbox N16R8 module: 16MB flash (QIO) + 8MB OPI PSRAM — matches boards/esp32-s3-devkitc-1-n16r8v.json
board_build.arduino.memory_type = qio_opi
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/researchanddesire/rad-ble.git#4af1c5f8cbcd94af651d3d34db65cf6a86966359
    h2zero/NimBLE-Arduino@2.4.0
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit seesaw Library@1.7.9
    adafruit/Adafruit NeoPixel@1.15.5
    adafruit/Adafruit SSD1306@2.5.17
    ricmoo/QRCode@0.0.1
    bblanchon/ArduinoJson@7.4.3
    igorantolic/Ai Esp32 Rotary Encoder@1.7.0
    mathertel/OneButton@2.6.2
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
    adafruit/Adafruit INA219@1.2.3
upload_speed = 921600
check_skip_packages = true
check_tool = clangtidy
check_flags =
    clangtidy: --checks=-\*,bugprone-*,boost-*,modernize-*,performance-*,clang-analyzer-*,cert-dcl03-c,cert-dcl21-cpp,cert-dcl58-cpp,cert-err34-c,cert-err52-cpp,cert-err58-cpp,cert-err60-cpp,cert-flp30-c,cert-msc50-cpp,cert-msc51-cpp,cert-oop54-cpp,cert-str34-c,cppcoreguidelines-interfaces-global-init,cppcoreguidelines-narrowing-conversions,cppcoreguidelines-pro-type-member-init,cppcoreguidelines-pro-type-static-cast-downcast,cppcoreguidelines-slicing,google-default-arguments,google-explicit-constructor,google-runtime-operator,hicpp-exception-baseclass,hicpp-multiway-paths-covered,hicpp-signed-bitwise,portability-simd-intrinsics,readability-avoid-const-params-in-decls,readability-const-return-type,readability-container-size-empty,readability-convert-member-functions-to-static,readability-delete-null-pointer,readability-deleted-default,readability-inconsistent-declaration-parameter-name,readability-make-member-function-const,readability-misleading-indentation,readability-misplaced-array-index,readability-non-const-parameter,readability-redundant-control-flow,readability-redundant-declaration,readability-redundant-function-ptr-dereference,readability-redundant-smartptr-get,readability-simplify-subscript-expr,readability-static-accessed-through-instance,readability-static-definition-in-anonymous-namespace,readability-string-compare,readability-uniqueptr-delete-release,readability-use-anyofallof,-modernize-use-trailing-return-type,-readability-convert-member-functions-to-static,-bugprone-easily-swappable-parameters,-readability-make-member-function-const
extra_scripts = pre:pre_build_script.py, pre:firmware_build_metadata.py
board_build.filesystem = littlefs

[env:development-r8]
build_flags =
    -std=gnu++17
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
;    CORE_DEBUG_LEVEL Details: https://docs.platformio.org/en/latest/platforms/espressif32.html#debug-level
    -D CORE_DEBUG_LEVEL=4
    -D VERSIONDEV
    -D SW_VERSION=0
    -D NO_UPDATE
    -D FIRMWARE_TRACK="\"main\""
extends = common
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8v
framework = arduino, espidf
debug_tool = esp-builtin
debug_init_break = break setup
build_type = debug
monitor_speed = 115200
monitor_filters = colorize, esp32_exception_decoder, time, log2file
test_filter = test_integration
test_build_src = true
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.development-r8

; Factory-eFuse-confirmed ESP32-S3R2 module: 16MB QIO flash + 2MB Quad PSRAM.
; This is the same standard development application with the PSRAM interface
; required by R2 silicon. Upload with: pio run -e development-r2 -t upload
[env:development-r2]
extends = env:development-r8
board = esp32-s3-devkitc-1-n16r2v
board_build.arduino.memory_type = qio_qspi
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.psram-r2.defaults"
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.development-r2

[env:production-r8]
build_flags =
    -std=gnu++17
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D CORE_DEBUG_LEVEL=3
    -D FIRMWARE_TRACK="\"main\""
    -D SW_VERSION=0
    -D RAD_SERVER="\"https://dashboard.researchanddesire.com\""
    -D MQTT_SERVER="\"mqtts://te9acc16.ala.us-east-1.emqxsl.com\""
    -D MQTT_PORT=8883
extends = common
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8v
framework = arduino, espidf
monitor_speed = 115200
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.production-r8

[env:production-r2]
extends = env:production-r8
board = esp32-s3-devkitc-1-n16r2v
board_build.arduino.memory_type = qio_qspi
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.psram-r2.defaults"
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.production-r2

[env:test]
lib_ignore = RadBLE, NimBLE-Arduino
lib_deps =
    ; Source-only dependency for native real-envelope regression checks.
    https://github.com/researchanddesire/rad-ble.git#4af1c5f8cbcd94af651d3d34db65cf6a86966359
    fabiobatsilva/ArduinoFake@0.4.0
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=gnu++17
    -D DEBUGLOG_DEFAULT_LOG_LEVEL_DEBUG
    -D UNITY_INCLUDE_DOUBLE
    -D CORE_DEBUG_LEVEL=0
    -D SW_VERSION="0.0.0"
    -D VERSIONTEST
    -Wno-missing-template-arg-list-after-template-kw
; Native CI only runs host-compatible suites. Hardware integration tests run
; under development, while test_display contains golden artifacts only.
test_ignore =
    test_idle
    test_display
    test_integration
    test_http_worker_security
    test_firmware_runtime
    test_pairing_refresh
extends = common
platform = native@1.2.1

[env:test_native]
platform = native@1.2.1
lib_ignore = RadBLE, NimBLE-Arduino
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -I test/test_idle
    -I src
test_filter = test_idle

[env:staging-r8]
extends = env:production-r8
build_flags =
    -std=gnu++17
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D CORE_DEBUG_LEVEL=3
    -D FIRMWARE_TRACK="\"staging\""
    -D SW_VERSION=0
    -D RAD_SERVER="\"https://staging.researchanddesire.com\""
    -D MQTT_SERVER="\"mqtts://x15ff600.ala.us-east-1.emqxsl.com\""
    -D MQTT_PORT=8883
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.staging-r8

[env:staging-r2]
extends = env:staging-r8
board = esp32-s3-devkitc-1-n16r2v
board_build.arduino.memory_type = qio_qspi
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.psram-r2.defaults"
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.staging-r2
