name: Firmware CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging, 'AJ/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install platformio==6.1.19
      - name: Test native firmware
        working-directory: software/firmware
        run: |
          pio test -e test
          pio test -e test_native
      - name: Test build tools and local services
        run: |
          python -m unittest discover -s software/scripts -p 'test_*.py'
          python -m unittest discover -s software/dev -p 'test_*.py'
      - name: Test firmware release publisher
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test asynchronous HTTP and TLS with sanitizers
        run: python software/scripts/test_http_worker_security.py
      - name: Test OTA stream integrity with sanitizers
        run: python software/scripts/test_firmware_runtime.py
      - name: Test pairing expiry and environment routing with sanitizers
        run: python software/scripts/test_pairing_refresh.py
      - name: Test bounded provenance and real signed-proof reassembly
        run: python software/firmware/test/security_firmware_provenance/test_response.py
      - name: Install verified secret scanner
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan software and retained history
        run: python software/scripts/check_software.py --history

  local-service-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Test isolated HTTPS fixture
        run: python software/dev/fixture/test_http_fixture.py -v
      - name: Test local RAD App TLS front
        run: python software/dev/fixture/test_rad_app_front.py -v
      - name: Start synthetic local services
        run: python software/dev/dev_services.py up --backend fixture --lan-ip 127.0.0.1 --device-id AA:BB:CC:DD:EE:FF --device-id AA:BB:CC:DD:EE:FE
      - name: Verify HTTPS authentication and MQTT topic isolation
        run: python software/dev/fixture/test_compose_integration.py -v
      - name: Stop local services
        if: always()
        run: python software/dev/dev_services.py down

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [development-r2, development-r8, staging-r2, staging-r8, production-r2, production-r8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install platformio==6.1.19
      - name: Compile firmware
        working-directory: software/firmware
        env:
          PROFILE: ${{ matrix.profile }}
          CI: 'true'
        run: pio run -e "$PROFILE"
      - name: Verify pinned SDK DHCP backport
        run: python software/scripts/test_sdk_security.py --regression
      # Development binaries contain per-run fixture credentials. Build outputs
      # stay on this disposable runner. Private release tooling builds exact,
      # reviewed Production commits and handles signing/publication separately.
