name: Repository checks

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  check_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for documentation package
        id: docs
        run: |
          if [ -f Documentation/pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Documentation package not present; skipping docs validation."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.docs.outputs.present == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v6
        if: steps.docs.outputs.present == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: Documentation/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.docs.outputs.present == 'true'
        run: |
          cd Documentation
          pnpm install

      - name: Validate documentation
        if: steps.docs.outputs.present == 'true'
        run: |
          cd Documentation
          pnpm run mint:validate
