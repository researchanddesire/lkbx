name: Documentation
description: User docs (simple-docs) or developer docs (developer-docs / dev-docs)
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation type
      options:
        - User guide → simple-docs
        - Developer docs → Lockbox/developer-docs/
        - Cross-product → dev-docs repo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should change?
    validations:
      required: true
