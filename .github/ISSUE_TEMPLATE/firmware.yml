name: Firmware bug or feature
description: Report a firmware issue or request a behavior change
title: "[Firmware] "
labels: ["firmware"]
body:
  - type: markdown
    attributes:
      value: |
        Include the firmware version and hardware variant (R2 or R8) when known.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened or what should change?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version
      placeholder: e.g. 1.21.12
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include device state, Wi-Fi/MQTT status if relevant
