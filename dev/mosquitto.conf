user mosquitto
pid_file /tmp/mosquitto.pid
persistence false
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
# A supplied client ID cannot evict another authenticated fixture device.
use_username_as_clientid true
password_file /tmp/passwords
acl_file /tmp/broker.acl
cafile /tmp/ca.pem
certfile /tmp/server.pem
keyfile /tmp/server.key
tls_version tlsv1.2
require_certificate false
max_connections 20
max_packet_size 32768
message_size_limit 16384
log_type error
log_type warning
